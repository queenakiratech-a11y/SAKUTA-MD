<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAKUTA MD — WhatsApp Pairing</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at top, #1a1a2e 0%, #0d0d16 100%);
    color: #f1f1f1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,120,50,0.25);
    border-radius: 18px;
    padding: 36px 28px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 0 40px rgba(255,90,30,0.12);
    text-align: center;
  }
  .logo {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(90deg, #ff5f2e, #ffb100);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .sub {
    color: #a0a0b0;
    font-size: 13px;
    margin-bottom: 28px;
  }
  label {
    display: block;
    text-align: left;
    font-size: 13px;
    color: #c8c8d8;
    margin-bottom: 6px;
  }
  input[type=text] {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-size: 15px;
    outline: none;
    margin-bottom: 18px;
  }
  input[type=text]:focus { border-color: #ff5f2e; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #ff5f2e, #ffb100);
    color: #16161f;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: opacity .2s;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { font-size: 12px; color: #8a8a9a; margin-top: 14px; line-height: 1.5; }
  .result { margin-top: 22px; display: none; }
  .code-box {
    font-size: 30px;
    letter-spacing: 3px;
    font-weight: 800;
    color: #ffb100;
    background: rgba(255,177,0,0.08);
    border: 1px dashed rgba(255,177,0,0.4);
    border-radius: 12px;
    padding: 16px;
    margin: 14px 0;
  }
  .steps { text-align: left; font-size: 13px; color: #d0d0e0; line-height: 1.8; }
  .error { display: none; color: #ff6b6b; font-size: 13px; margin-top: 14px; }
  .spinner {
    display: none;
    margin: 20px auto 0;
    width: 26px;
    height: 26px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #ff5f2e;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🔥 SAKUTA MD</div>
    <div class="sub">Get pairing code to connect the bot without Telegram</div>

    <form id="pairForm">
      <label for="phone">Your WhatsApp number (with country code, no +)</label>
      <input type="text" id="phone" name="phone" placeholder="Example: 50937xxxxxx" autocomplete="off" required>
      <button type="submit" id="submitBtn">Get Pairing Code</button>
    </form>

    <div class="spinner" id="spinner"></div>
    <div class="error" id="errorBox"></div>

    <div class="result" id="resultBox">
      <div style="font-size:13px;color:#a0a0b0;">Your code is:</div>
      <div class="code-box" id="codeText">----</div>
      <div class="steps">
        1. Open WhatsApp<br>
        2. Go to <b>Linked devices</b><br>
        3. Tap <b>Link a device</b><br>
        4. Tap <b>Link with phone number</b><br>
        5. Enter the code above
      </div>
    </div>

    <div class="hint">The code may take a few seconds to generate. Do not close this page.</div>
  </div>

<script>
const form = document.getElementById('pairForm');
const btn = document.getElementById('submitBtn');
const spinner = document.getElementById('spinner');
const errorBox = document.getElementById('errorBox');
const resultBox = document.getElementById('resultBox');
const codeText = document.getElementById('codeText');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';
  resultBox.style.display = 'none';
  const phone = document.getElementById('phone').value.trim();

  if (!/^\d{7,15}$/.test(phone)) {
    errorBox.textContent = 'Enter a valid number, no + or spaces.';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  spinner.style.display = 'block';

  try {
    // Call LOCAL /api/pair on Vercel — this is the serverless function
    // that will contact the backend Pterodactyl for us.
    const res = await fetch('/api/pair', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone })
    });
    const data = await res.json();

    if (!res.ok || !data.code) {
      throw new Error(data.error || 'Error generating code.');
    }

    codeText.textContent = data.code;
    resultBox.style.display = 'block';
  } catch (err) {
    errorBox.textContent = err.message || 'Something went wrong. Try again.';
    errorBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    spinner.style.display = 'none';
  }
});
</script>
</body>
</html>
